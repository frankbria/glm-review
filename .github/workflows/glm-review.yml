name: GLM Review

# This repo reviews its own pull requests with the reviewer it ships. Kept in
# sync with caller.yml — the canonical example handed to consuming repos — with
# one deliberate difference, below.

on:
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - "**/*.md"
      - ".gitignore"

jobs:
  review:
    # Skip bot-authored PRs — see caller.yml for why this is a skip and not the
    # action's `allowed_bots`. This repo's own dependabot.yml opens
    # github-actions bumps, which the size gate happens to filter out anyway;
    # the guard is here so this file stays a faithful copy of what consumers run.
    # `sender.type` is tested alongside it because the action keys off
    # `github.actor`, which is the pusher on `synchronize` rather than the
    # author — see caller.yml for the full reasoning.
    # Then: only review substantial changes (5+ files, or 20+ additions/deletions).
    if: |
      github.event.pull_request.user.type == 'User' &&
      github.event.sender.type == 'User' &&
      (github.event.pull_request.changed_files >= 5 ||
       github.event.pull_request.additions >= 20 ||
       github.event.pull_request.deletions >= 20)
    # Local path, not `frankbria/glm-review/.github/workflows/review.yml@main`
    # as consuming repos use. A local call resolves against the caller's own
    # commit, so a PR here is reviewed by the review.yml *in that PR* rather
    # than by the copy already on main. That is the point of reviewing
    # ourselves: a change to the reviewer gets exercised before it merges and
    # ships to the repos that track @main. It also keeps the permissions block
    # below honest — pinning @main would require granting whatever main
    # currently declares, since GitHub fails a run whose caller grants less
    # than the called job requests.
    #
    # Consequence to know about: a PR that breaks review.yml breaks its own
    # review. That is the desired failure mode — better here than downstream.
    uses: ./.github/workflows/review.yml
    # Kimi Code subscription, not the pay-per-token Moonshot platform: keys
    # are not interchangeable between the two (a 401). ZHIPU_API_KEY is kept
    # as a repo secret, so reverting to GLM is dropping `with:` and the secret
    # mapping below back to ZHIPU_API_KEY.
    with:
      base_url: https://api.kimi.com/coding/
      model: k3[1m]
    permissions:
      contents: read
      pull-requests: write
    secrets:
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
